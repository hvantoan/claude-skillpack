# Append these sections to an existing .editorconfig
# for monorepo or existing projects

[packages/web/**]
indent_style = space
indent_size = 2

[*.{ts,tsx}]
indent_style = space
indent_size = 2
insert_final_newline = true
trim_trailing_whitespace = true

[*.json]
indent_style = space
indent_size = 2

[*.{yml,yaml}]
indent_style = space
indent_size = 2
